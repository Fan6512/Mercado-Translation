<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>生成图标 icon.png / icon.ico</title>
<style>
  body{font-family:system-ui,'Microsoft YaHei',sans-serif;max-width:760px;margin:40px auto;padding:0 20px;color:#111}
  h1{font-size:20px}
  .row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:20px 0}
  canvas{border:1px solid #ddd;border-radius:12px;background:#f8fafc}
  button{padding:10px 18px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}
  button:hover{background:#1d4ed8}
  .tip{color:#666;font-size:13px;line-height:1.6}
  code{background:#f1f5f9;padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<h1>生成 App 图标</h1>
<p class="tip">下面是预览（512×512）。点按钮会下载 <code>icon.png</code>（1024×1024）和 <code>icon.ico</code>（含 16/32/48/64/128/256 多尺寸），保存到这个文件夹里就行。</p>
<div class="row">
  <canvas id="preview" width="512" height="512"></canvas>
  <div>
    <p><button onclick="dl('png')">下载 icon.png</button></p>
    <p><button onclick="dl('ico')">下载 icon.ico</button></p>
    <p class="tip">Pake 打包用的是 <code>icon.ico</code>。</p>
  </div>
</div>

<script>
const svgText = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="448" rx="200" ry="200" fill="#ffffff" opacity="0.08"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-weight="800" fill="#ffffff" text-anchor="middle">
    <text x="320" y="640" font-size="440">A</text>
    <text x="720" y="640" font-size="420">文</text>
  </g>
  <g stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <line x1="450" y1="540" x2="590" y2="540"/>
    <polyline points="470,510 440,540 470,570"/>
    <polyline points="570,510 600,540 570,570"/>
  </g>
  <g transform="translate(760,180)" opacity="0.95">
    <circle cx="0" cy="0" r="78" fill="#ffffff"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#2563eb" stroke-width="6"/>
    <ellipse cx="0" cy="0" rx="78" ry="32" fill="none" stroke="#2563eb" stroke-width="5"/>
    <ellipse cx="0" cy="0" rx="32" ry="78" fill="none" stroke="#2563eb" stroke-width="5"/>
    <line x1="-78" y1="0" x2="78" y2="0" stroke="#2563eb" stroke-width="5"/>
  </g>
</svg>`;

function svgToImage(){
  return new Promise((resolve,reject)=>{
    const blob = new Blob([svgText],{type:'image/svg+xml'});
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = reject;
    img.src = url;
  });
}

function renderTo(canvas,img){
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
}

let masterImg;
svgToImage().then(img=>{ masterImg=img; renderTo(document.getElementById('preview'),img); });

function makePngBlob(size){
  return new Promise(resolve=>{
    const c = document.createElement('canvas');
    c.width = c.height = size;
    renderTo(c,masterImg);
    c.toBlob(b=>resolve(b),'image/png');
  });
}

async function dl(type){
  if(!masterImg){ alert('图片还在加载，请稍等'); return; }
  if(type==='png'){
    const blob = await makePngBlob(1024);
    saveBlob(blob,'icon.png');
    return;
  }
  // 生成 ICO（多尺寸）
  const sizes = [16,32,48,64,128,256];
  const pngs = [];
  for(const s of sizes){
    const blob = await makePngBlob(s);
    const buf = await blob.arrayBuffer();
    pngs.push({size:s,buf:new Uint8Array(buf)});
  }
  const ico = buildIco(pngs);
  saveBlob(new Blob([ico],{type:'image/x-icon'}),'icon.ico');
}

// ICO 文件结构：6字节 header + 16字节×N directory + 各 PNG 数据
function buildIco(entries){
  const headerSize = 6;
  const dirSize = 16 * entries.length;
  let offset = headerSize + dirSize;
  const totalDataSize = entries.reduce((s,e)=>s+e.buf.length,0);
  const out = new Uint8Array(headerSize + dirSize + totalDataSize);
  const dv = new DataView(out.buffer);

  dv.setUint16(0,0,true);        // reserved
  dv.setUint16(2,1,true);        // type = 1 (icon)
  dv.setUint16(4,entries.length,true); // count

  let dirOff = 6;
  for(const e of entries){
    const s = e.size===256?0:e.size; // 256 写 0
    dv.setUint8(dirOff,s);             // width
    dv.setUint8(dirOff+1,s);           // height
    dv.setUint8(dirOff+2,0);           // colors
    dv.setUint8(dirOff+3,0);           // reserved
    dv.setUint16(dirOff+4,1,true);     // planes
    dv.setUint16(dirOff+6,32,true);    // bpp
    dv.setUint32(dirOff+8,e.buf.length,true);  // size
    dv.setUint32(dirOff+12,offset,true);       // offset
    out.set(e.buf,offset);
    offset += e.buf.length;
    dirOff += 16;
  }
  return out;
}

function saveBlob(blob,name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
</script>
</body>
</html>
