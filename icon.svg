<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- 圆角底 -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)"/>
  <!-- 高光 -->
  <rect x="64" y="64" width="896" height="448" rx="200" ry="200" fill="#ffffff" opacity="0.08"/>
  <!-- 内容：A ⇄ 文 -->
  <g filter="url(#shadow)" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-weight="800" fill="#ffffff" text-anchor="middle">
    <text x="320" y="640" font-size="440">A</text>
    <text x="720" y="640" font-size="420">文</text>
  </g>
  <!-- 中间的双向箭头 -->
  <g stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <line x1="450" y1="540" x2="590" y2="540"/>
    <polyline points="470,510 440,540 470,570"/>
    <polyline points="570,510 600,540 570,570"/>
  </g>
  <!-- 小角标：地球（跨境） -->
  <g transform="translate(760,180)" opacity="0.95">
    <circle cx="0" cy="0" r="78" fill="#ffffff"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#2563eb" stroke-width="6"/>
    <ellipse cx="0" cy="0" rx="78" ry="32" fill="none" stroke="#2563eb" stroke-width="5"/>
    <ellipse cx="0" cy="0" rx="32" ry="78" fill="none" stroke="#2563eb" stroke-width="5"/>
    <line x1="-78" y1="0" x2="78" y2="0" stroke="#2563eb" stroke-width="5"/>
  </g>
</svg>
