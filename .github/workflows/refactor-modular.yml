name: Apply modular refactor

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/modular-api-adapter-v1
    paths:
      - 'tools/refactor_modular.py'
      - 'src/api/provider-adapters.js'
      - '.github/workflows/refactor-modular.yml'

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/modular-api-adapter-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded modular extraction
        run: python tools/refactor_modular.py

      - name: Rebuild local Tailwind CSS with HTML and JS content
        run: npx --yes tailwindcss@3.4.17 -i ./tools/tailwind-input.css -o ./tailwind.min.css --content './index.html,./src/**/*.js' --minify

      - name: Validate modular app
        run: python tools/validate_app.py

      - name: Commit generated refactor
        run: |
          if git diff --quiet -- index.html src/app.js tailwind.min.css; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/app.js tailwind.min.css
          git commit -m 'refactor: extract app script and route requests through provider adapter [skip ci]'
          git push origin HEAD:refactor/modular-api-adapter-v1
