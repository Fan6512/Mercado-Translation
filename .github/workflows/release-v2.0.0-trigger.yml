name: Trigger v2.0.0 release once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v2.0.0-trigger.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch formal v2.0.0 release
    runs-on: ubuntu-latest
    steps:
      - name: Ensure v2.0.0 does not already exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v2.0.0" >/dev/null 2>&1; then
            echo "Tag v2.0.0 already exists; refusing to dispatch a duplicate release."
            exit 1
          fi

      - name: Dispatch existing formal release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/release-windows.yml/dispatches" \
            --method POST \
            -f ref=main \
            -f 'inputs[version]=v2.0.0'
          echo "Formal v2.0.0 release workflow dispatched."
