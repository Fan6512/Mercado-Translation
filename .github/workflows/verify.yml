name: Verify app safety and syntax

on:
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'src/**/*.js'
      - 'tailwind.min.css'
      - '启动翻译工具.bat'
      - '启动翻译工具(兼容模式).bat'
      - 'tools/validate_app.py'
      - 'tools/tailwind-input.css'
      - '.github/workflows/verify.yml'
      - '.github/workflows/release-windows.yml'
      - 'tools/New-SelfSignedCodeSigningCert.ps1'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'src/**/*.js'
      - 'tailwind.min.css'
      - '启动翻译工具.bat'
      - '启动翻译工具(兼容模式).bat'
      - 'tools/validate_app.py'
      - 'tools/tailwind-input.css'
      - '.github/workflows/verify.yml'
      - '.github/workflows/release-windows.yml'
      - 'tools/New-SelfSignedCodeSigningCert.ps1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate app invariants and JavaScript syntax
        run: python tools/validate_app.py

      - name: Validate release workflow YAML
        run: ruby -e "require 'yaml'; YAML.safe_load(File.read('.github/workflows/release-windows.yml'), aliases: true)"

      - name: Validate release helper PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\tools\New-SelfSignedCodeSigningCert.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell syntax validation failed.'
          }
