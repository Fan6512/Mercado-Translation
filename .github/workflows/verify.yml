name: Verify app safety and syntax

on:
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'src/**/*.js'
      - 'tailwind.min.css'
      - '启动翻译工具.bat'
      - '启动翻译工具(兼容模式).bat'
      - 'tools/validate_app.py'
      - 'tools/tailwind-input.css'
      - '.github/workflows/verify.yml'
      - '.github/workflows/release-windows.yml'
      - 'tools/New-SelfSignedCodeSigningCert.ps1'
      - 'tools/Patch-PakeWindowsUpdater.ps1'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'src/**/*.js'
      - 'tailwind.min.css'
      - '启动翻译工具.bat'
      - '启动翻译工具(兼容模式).bat'
      - 'tools/validate_app.py'
      - 'tools/tailwind-input.css'
      - '.github/workflows/verify.yml'
      - '.github/workflows/release-windows.yml'
      - 'tools/New-SelfSignedCodeSigningCert.ps1'
      - 'tools/Patch-PakeWindowsUpdater.ps1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate app invariants and JavaScript syntax
        run: python tools/validate_app.py

      - name: Validate release workflow YAML
        run: |
          ruby -e "require 'yaml'; YAML.safe_load(File.read('.github/workflows/release-windows.yml'), aliases: true)"

      - name: Validate release helper PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in @(
            '.\tools\New-SelfSignedCodeSigningCert.ps1',
            '.\tools\Patch-PakeWindowsUpdater.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script : $($_.Message)" }
              throw "PowerShell syntax validation failed: $script"
            }
          }


  validate-windows-updater-template:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Rust
        shell: pwsh
        run: |
          rustup default stable
          rustc --version
          cargo --version

      - name: Install pinned Pake
        shell: pwsh
        run: |
          npm install --global "pake-cli@3.16.3"
          pake --version

      - name: Patch pinned Pake Windows template
        shell: pwsh
        run: |
          .\tools\Patch-PakeWindowsUpdater.ps1

          $pakeRoot = Join-Path ((& npm root -g).Trim()) 'pake-cli'
          $configPath = Join-Path $pakeRoot 'src-tauri\tauri.windows.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          if ($config.bundle.windows.wix.upgradeCode -ne '1ffd51d4-30e3-5cb0-996c-b694974be021') {
            throw 'Pinned MSI UpgradeCode was not applied.'
          }

          $invokePath = Join-Path $pakeRoot 'src-tauri\src\app\invoke.rs'
          $invoke = Get-Content $invokePath -Raw
          if (-not $invoke.Contains('download_and_install_update')) {
            throw 'Native updater bridge was not applied.'
          }

      - name: Cargo check patched Pake template
        shell: pwsh
        run: |
          $pakeRoot = Join-Path ((& npm root -g).Trim()) 'pake-cli'
          cargo check --manifest-path (Join-Path $pakeRoot 'src-tauri\Cargo.toml')
